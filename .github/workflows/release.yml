name: Release

# Builds LoLAutoDirector.exe. Push a tag like v1.0.0 to publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build LoLAutoDirector.exe
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name LoLAutoDirector --collect-all cv2 --collect-all customtkinter run.py
      - name: Check that the exe starts
        run: python -c "import subprocess; r=subprocess.run(['dist/LoLAutoDirector.exe','help'],timeout=120); assert r.returncode == 0, r.returncode"
      - uses: actions/upload-artifact@v4
        with:
          name: LoLAutoDirector-windows
          path: dist/LoLAutoDirector.exe
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoLAutoDirector.exe
          generate_release_notes: true
